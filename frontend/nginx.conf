# 브라우저 입장에서는 한 출처다. /api와 /ws만 게이트웨이로 넘기고 나머지는 빌드한 화면을 준다.
# resolve: 게이트웨이가 다시 만들어져 주소가 바뀌어도 nginx를 재시작할 필요가 없다.
resolver 127.0.0.11 valid=1s ipv6=off;

upstream gateways {
    zone gateways 64k;
    least_conn;
    server edge-gateway-a:8080 resolve max_fails=1 fail_timeout=5s;
    server edge-gateway-b:8080 resolve max_fails=1 fail_timeout=5s;
}

# 소켓은 브라우저가 고른 게이트웨이(?gw=)로 붙는다. 연결이 안 되면 다른 쪽으로 넘어간다.
# 멈춘 게이트웨이는 TCP 연결을 받아 주므로 nginx 혼자서는 알아채지 못한다. 그래서 끊기면 브라우저가 다른 쪽을 고른다.
upstream gateway_a_first {
    zone gateway_a_first 64k;
    server edge-gateway-a:8080 resolve max_fails=1 fail_timeout=1s;
    server edge-gateway-b:8080 resolve backup;
}

upstream gateway_b_first {
    zone gateway_b_first 64k;
    server edge-gateway-b:8080 resolve max_fails=1 fail_timeout=1s;
    server edge-gateway-a:8080 resolve backup;
}

map $arg_gw $ws_upstream {
    b       gateway_b_first;
    default gateway_a_first;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://gateways;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;   # 멈춘 게이트웨이에 걸린 조회가 60초씩 기다리지 않게 한다
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /ws {
        proxy_pass http://$ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        # 게이트웨이는 0.5초마다 생존 신호를 보낸다. 5초 동안 없으면 죽은 연결이다.
        proxy_read_timeout 5s;
        proxy_send_timeout 1h;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
