server.port: 8080
spring:
  application.name: edge-gateway
  threads.virtual.enabled: true
  cloud.gateway.server.webmvc.routes:
    - id: marketdata-api
      uri: ${anthill.marketdata.url}
      predicates:
        - Path=/api/**
anthill:
  marketdata.url: http://localhost:8081
  ws:
    allowed-origins: [ "*" ]
    max-subscriptions: 50
    # 이만큼 보낸 게 없는 연결에 ping을 보낸다. 브라우저는 3초 무소식이면 끊긴 것으로 보고 다시 연결한다.
    heartbeat-idle: 1s
  events.subscribers:
    - types: [ "realtime." ]
      url: http://localhost:8081/internal/events
management.endpoints.web.exposure.include: health,metrics
