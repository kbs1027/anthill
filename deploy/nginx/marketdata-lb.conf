# 게이트웨이의 REST 조회가 살아 있는 marketdata로 가게 한다. 평소에는 a만 읽어 같은 곳에서 답한다.
resolver 127.0.0.11 valid=1s ipv6=off;

upstream marketdata {
    zone marketdata 64k;
    server marketdata-a:8081 resolve max_fails=1 fail_timeout=10s;
    server marketdata-b:8081 resolve max_fails=1 fail_timeout=10s backup;
}

server {
    listen 8081;

    location / {
        proxy_pass http://marketdata;
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
    }
}
